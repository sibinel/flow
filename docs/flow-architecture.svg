  <path d="M206 227 H448" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <text x="327" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57534e">mensagem e anexo</text>

