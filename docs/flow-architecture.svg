  <text x="544" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">só depois da aprovação</text>

  <rect x="760" y="524" width="200" height="76" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="860" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Fila</text>
  <text x="860" y="574" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a16207">aprova, não envia</text>

