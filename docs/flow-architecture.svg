<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <rect width="920" height="560" fill="#f7f5f2"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1c1917">flow na máquina do advogado</text>
  <text x="40" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#57534e">Um processo local. A nuvem só guarda a cópia.</text>

  <rect x="40" y="96" width="150" height="72" rx="8" fill="#fff" stroke="#a8a29e"/>
  <text x="115" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1c1917">WhatsApp</text>
  <text x="115" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">serviço externo</text>

  <rect x="40" y="188" width="150" height="72" rx="8" fill="#fff" stroke="#a8a29e"/>
  <text x="115" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1c1917">E-mail</text>
  <text x="115" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">serviço externo</text>

  <rect x="250" y="120" width="620" height="390" rx="12" fill="#fff" stroke="#1c1917" stroke-width="1.5"/>
  <text x="270" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#78716c">máquina local</text>

  <rect x="280" y="170" width="160" height="78" rx="8" fill="#e7f0e8" stroke="#3f6212"/>
  <text x="360" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Leitores</text>
  <text x="360" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3f6212">só entram</text>

  <rect x="500" y="170" width="180" height="78" rx="8" fill="#eef2ff" stroke="#3730a3"/>
  <text x="590" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Repositório</text>
  <text x="590" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3730a3">fonte da verdade</text>

  <rect x="720" y="170" width="120" height="78" rx="8" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="780" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1c1917">Nuvem</text>
  <text x="780" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">cópia</text>

  <rect x="280" y="290" width="160" height="78" rx="8" fill="#fff7ed" stroke="#9a3412"/>
  <text x="360" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Classificador</text>
  <text x="360" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9a3412">um cliente por vez</text>

  <rect x="500" y="290" width="160" height="78" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="580" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Fila</text>
  <text x="580" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a16207">aprova, não envia</text>

  <rect x="700" y="290" width="140" height="78" rx="8" fill="#fee2e2" stroke="#991b1b"/>
  <text x="770" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c1917">Remetente</text>
  <text x="770" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">só depois</text>

  <path d="M190 132 H250" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <path d="M190 224 H250" stroke="#1c1917" fill="none"/>
  <path d="M250 180 V224" stroke="#1c1917" fill="none"/>
  <path d="M440 209 H500" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <path d="M680 209 H720" stroke="#a8a29e" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M360 248 V290" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <path d="M440 329 H500" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 329 H700" stroke="#1c1917" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 290 V132 H840" stroke="#991b1b" fill="none"/>
  <path d="M840 132 H190" stroke="#991b1b" fill="none" marker-end="url(#arrowred)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#1c1917"/>
    </marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#a8a29e"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#991b1b"/>
    </marker>
  </defs>
</svg>
