  <path d="M448 530 H250 V300 H121 V263" stroke="#991b1b" fill="none" marker-end="url(#arrowred)"/>
  <text x="186" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">envia</text>

  <path d="M544 612 V690 H121 V600" stroke="#991b1b" fill="none" marker-end="url(#arrowred)"/>
  <text x="332" y="678" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">envia</text>

  <path d="M1264 405 H1368" stroke="#a8a29e" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowgray)"/>
  <text x="1316" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">sincroniza</text>

  <defs>
