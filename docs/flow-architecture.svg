  <text x="860" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9a3412">um cliente por vez</text>

  <rect x="448" y="512" width="192" height="100" rx="8" fill="#fee2e2" stroke="#991b1b"/>
