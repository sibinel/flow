[project]
name = "flow"
version = "0.1.0"
description = "Agente administrativo na máquina do advogado."
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
flow = "flow.window:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow = ["qml/Main.qml"]
